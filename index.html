<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1a1f26;font-family:Inter,system-ui,sans-serif;color:#fff}

kbd{display:inline-block;border:1px solid #fff5;border-radius:5px;padding:0 6px;background:#111820bb;font-weight:800}

button.on{background:#3fd6c6;color:#06201d}#skid{background:#7d3831}

#bikes{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;padding:8px}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#05080cfa 0%,#0a1218f2 28%,#0d1a2288 42%,transparent 55%);pointer-events:none}
.mbox{text-align:center;padding:8px 14px 10px;pointer-events:auto;max-width:min(920px,96vw);width:100%}.mt{font-size:clamp(18px,3.5vw,28px);font-weight:900;letter-spacing:.08em;color:#3fe0cf;margin:0}.ms{color:#c9d1d6;margin:2px 0 6px;font-size:11px}

#race{top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-weight:900;letter-spacing:.06em;white-space:nowrap}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:84px;font-weight:900;text-shadow:0 4px 24px #000a;pointer-events:none}
@media(max-width:800px){#race{top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px))}#msg{font-size:56px}#bikes{top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:96vw;flex-wrap:wrap;justify-content:center}#help{display:none}.big{font-size:32px}#ctl{left:10px;right:10px;justify-content:center}}

/* ===== NEO-INDUSTRIAL HUD ===== */
:root{--u:8px;--g:8px;--edge:12px;--pad:12px;--r:14px;--ink:#e8edf0;--mut:#8e9aa3;--line:#38424a;--amber:#ffb020;--teal:#3fe0cf;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--hz:repeating-linear-gradient(135deg,#ffb020 0 6px,#15191d 6px 12px)}
html,body{font-family:Inter,system-ui,sans-serif;background:#0f1316}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:var(--g);padding:calc(var(--edge) + env(safe-area-inset-top,0px)) calc(var(--edge) + env(safe-area-inset-right,0px)) calc(var(--edge) + env(safe-area-inset-bottom,0px)) calc(var(--edge) + env(safe-area-inset-left,0px));transition:opacity .2s}

#uiB{grid-area:2/1/3/4;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}#uiBC{flex:1 1 auto;justify-content:center;display:flex}
body:has(#menu:not([style*="display: none"])) #ui,body:has(#lobby[style*="display: flex"]) #ui{opacity:0;visibility:hidden}
body .card,body #ctl,body #roster,body #trainPanel,body #trainHud{background:radial-gradient(circle at 8px 8px,#5d6870 1.6px,#0000 2.4px),radial-gradient(circle at calc(100% - 8px) 8px,#5d6870 1.6px,#0000 2.4px),radial-gradient(circle at 8px calc(100% - 8px),#5d6870 1.6px,#0000 2.4px),radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),#5d6870 1.6px,#0000 2.4px),linear-gradient(180deg,#1d2328f0,#0e1215f2)!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;padding:var(--pad)!important;box-shadow:inset 0 1px 0 #ffffff14,0 6px 18px #0009;backdrop-filter:blur(6px);color:var(--ink)!important}
#ui .card,#ui #roster,#ui #trainPanel,#ui #trainHud{position:static!important;transform:none!important;margin:0!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;max-height:none!important;width:auto!important}
#ui #ctl{position:static;pointer-events:auto}#bikes,#trainPanel{pointer-events:auto}
#race:empty,#mpl:empty,#lb:empty,#trainHud:empty{display:none!important}
.sm{font:800 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.big{font:900 44px/1 var(--mono);font-variant-numeric:tabular-nums}.m{font:800 16px var(--mono)}
#hud{display:flex;gap:var(--pad);align-items:center}#hud>div+div{border-left:1px solid var(--line);padding-left:var(--pad)}
#hud div[style*="overflow:hidden"]{background:#0a0d0f!important;height:10px!important;border:1px solid var(--line);border-radius:6px!important}
#brand{font:900 11px var(--mono);letter-spacing:.16em;color:var(--amber)}
#race,#trainHud{font:800 12px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:normal!important;text-align:center;max-width:min(560px,100%);border-color:#ffb02088!important}
#race::before,#lb::before,#mpl::before,#tbox::before,#trainHud::before{content:"";display:block;height:5px;margin:calc(var(--pad)*-1) calc(var(--pad)*-1) var(--g);border-radius:var(--r) var(--r) 0 0;background:var(--hz)}
#mapc{padding:6px!important;border-radius:50%!important;background:#0c1013!important;border-color:#ffb02088!important;box-shadow:inset 0 0 0 3px #1a2025,0 6px 18px #0009}
#lb,#mpl{width:248px;max-width:100%;font:700 12px var(--mono)}#mpl{white-space:pre;line-height:1.6}#mpl::before{margin-bottom:var(--g)}
#lb .lh{display:flex;justify-content:space-between;font:900 10px var(--mono);letter-spacing:.16em;color:var(--amber);margin:0 0 var(--g);padding-bottom:var(--g);border-bottom:1px solid var(--line)}#lb .lh span{color:var(--mut)}
#lb .r{display:flex;align-items:center;gap:var(--g);padding:5px var(--u);border-radius:8px;border-bottom:1px solid #ffffff0d;font-weight:700}#lb .r:last-child{border-bottom:0}
#lb .r.me{background:#ffb02024;box-shadow:inset 3px 0 0 var(--amber);border-bottom-color:transparent}
#lb .p{min-width:36px;height:20px;border-radius:6px;background:#242c32;border:1px solid var(--line);color:#c4ced4;font:900 11px var(--mono);display:grid;place-items:center}
#lb .p1{background:linear-gradient(#ffd96a,#e0a416);color:#2a1d00;border-color:#8a6508}#lb .p2{background:linear-gradient(#e6ebee,#aab4ba);color:#1b2228;border-color:#6f7a81}#lb .p3{background:linear-gradient(#e0a06a,#a8642a);color:#2a1405;border-color:#6d3f17}
#lb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lb .g{color:var(--mut);font:700 11px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}#lb .gap{text-align:center;color:#fff5;line-height:.8;padding:2px 0}
#help{font:600 12px/2 var(--mono);color:var(--ink)}kbd{display:inline-block;border:1px solid #4a555e;border-bottom-width:3px;border-radius:6px;background:#1d242a;padding:0 6px;margin:0 2px;font:800 11px var(--mono);color:var(--amber)}
body button{border:1px solid #46525b;border-bottom-color:#14181b;background:linear-gradient(#2a3238,#1b2126);color:var(--ink);border-radius:10px;padding:10px var(--pad);font:800 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 1px 0 #ffffff14,0 2px 0 #000a}

#ctl{display:grid;grid-template-columns:repeat(5,minmax(52px,auto));gap:var(--g)}#ctl button{padding:10px var(--g)}#skid{background:linear-gradient(#6a2f2a,#4a1f1c)!important}

#msg{z-index:6;top:32%;font:900 clamp(40px,9vw,84px) var(--mono);color:var(--amber);letter-spacing:.06em;-webkit-text-stroke:2px #000a;text-shadow:0 4px 0 #000a}
body .mbox{background:linear-gradient(180deg,#1d2328f4,#0e1215f6);border:1px solid var(--line);border-radius:18px;padding:var(--pad);box-shadow:0 -6px 28px #000c}

body .ms{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:var(--g) 0}
body #bikeEdit{border:1px solid var(--line);background:#0b0f12;padding:var(--pad);border-radius:var(--r);box-shadow:none;margin-top:var(--g)}
body #bikeOptions{gap:var(--g)}body #bikeOptions label{font:800 9px var(--mono);letter-spacing:.12em;color:var(--mut)}body #bikeOptions select{padding:var(--g);background:#161c20;border:1px solid var(--line);border-radius:8px;font:700 12px var(--mono);color:var(--ink)}
body #bikeChoices{gap:var(--g);margin-bottom:var(--g)}
body #mmap,body #mdiff,body #mbtn{gap:var(--g);margin:0 0 var(--g)}body #mmap button,body #mdiff button{padding:8px var(--pad);font-size:11px}body #mdiff button.on{background:linear-gradient(#ff8a5a,#e5502a);color:#fff;border-color:#ffb08a}
body #mbtn button{font-size:12px;padding:10px var(--pad);border-radius:10px;background:linear-gradient(#2a3238,#1b2126)!important;color:var(--ink)!important}body #mbtn button:hover{background:linear-gradient(#ffc24a,#f59a0c)!important;color:#201300!important}
body #playBtn{margin:var(--pad) auto 0;padding:12px 40px;font-size:15px;letter-spacing:.14em;background:linear-gradient(#ffc24a,#f59a0c);color:#201300;border:1px solid #ffd27a;box-shadow:0 3px 0 #7a4d00,0 6px 18px #ffb02044}
body #backSetupBtn{margin-top:var(--g)}
body #tbox{width:min(440px,92vw);z-index:30;box-shadow:0 20px 60px #000c;text-align:left}body #tt{font:700 13px/1.7 var(--mono);white-space:pre;margin:0 0 var(--pad);padding-top:var(--g);border-top:1px solid var(--line)}body #tbox button{width:100%;background:linear-gradient(#ffc24a,#f59a0c);color:#201300}
body #lobby{background:radial-gradient(ellipse at center,#12191ff2,#05080cfa)}body #lobby input{margin:var(--g);padding:10px var(--pad);border-radius:10px;border:1px solid var(--line);background:#0b0f12;color:var(--ink);font:700 15px var(--mono)}body #lobby button{margin:var(--g)}

/* ===== ROAD RACER 3D: menu frame, tweens, training ===== */
body #menu{flex-direction:row;justify-content:flex-end;align-items:stretch;padding:var(--edge);gap:var(--g);background:linear-gradient(90deg,#05080c99 0,#05080c00 32%,#05080c00 56%,#05080cdd 100%);pointer-events:none}
#mTitle{position:absolute;left:calc(var(--edge) * 2);top:calc(var(--edge) * 2);font:900 clamp(30px,5.2vw,64px)/1 var(--mono);letter-spacing:.05em;color:var(--ink);text-shadow:0 3px 0 #000a;pointer-events:none}
#mTitle b{color:var(--amber)}#mTitle::after{content:"";display:block;height:6px;width:120px;margin-top:var(--pad);border-radius:3px;background:var(--hz)}
#mTitle small{display:block;margin-top:var(--g);font:800 11px var(--mono);letter-spacing:.22em;color:var(--mut)}#mTitle .musb{pointer-events:auto;margin-top:var(--pad);position:relative;z-index:1}
body #setupPanel,body #modePanel{position:relative;align-self:stretch;width:min(380px,100%);max-width:none;overflow-y:auto;text-align:left;pointer-events:auto;animation:slideIn .4s cubic-bezier(.2,.8,.2,1)}
body #setupPanel>.mt{display:none}body #modePanel>.mt{font-size:20px!important}
body #bikeChoices{justify-content:flex-start;max-height:none}body #playBtn,body #backSetupBtn{width:100%}
body #mbtn[style*="flex"]{display:grid!important;grid-template-columns:1fr 1fr}body #mmap[style*="flex"],body #mdiff[style*="flex"]{display:flex!important;flex-wrap:wrap}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@media(max-width:700px){body #menu{align-items:flex-end;background:linear-gradient(0deg,#05080cee 0,#05080c88 55%,#05080c00 100%)}body #setupPanel,body #modePanel{width:100%;align-self:flex-end;max-height:56vh}#mTitle{font-size:28px;left:var(--edge);top:var(--edge)}#mTitle small{display:none}}
/* hover tweens */
body button,body .card,body #ctl{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .25s,border-color .2s,color .2s,filter .2s,opacity .25s}
body button:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #ffffff1f,0 4px 0 #000a,0 8px 18px #ffb02033}
body button:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 1px 0 #ffffff14,0 1px 0 #000a}
body #lb .r{transition:background .2s,transform .2s}body #lb .r:hover{transform:translateX(3px);background:#ffffff0d}
body select,body input{transition:border-color .2s,box-shadow .2s}body select:hover,body select:focus,body input:focus{border-color:var(--amber);box-shadow:0 0 0 3px #ffb02033;outline:none}
body kbd{transition:transform .15s,color .15s,border-color .15s}body kbd:hover{transform:translateY(-1px);color:#fff;border-color:var(--amber)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* training HUD */
#trainHud{white-space:normal!important;text-align:left!important;min-width:min(300px,100%)!important;pointer-events:auto}
.th{display:grid;gap:var(--g)}.thr{display:flex;justify-content:space-between;align-items:center;gap:var(--g);font:800 12px var(--mono);letter-spacing:.06em}.thl{font:800 9px var(--mono);letter-spacing:.16em;color:var(--mut)}
.thbar,.thmeter{position:relative;height:10px;border-radius:6px;background:#0a0d0f;border:1px solid var(--line);overflow:hidden}.thmeter{height:14px;overflow:visible}
.thbar i,.thmeter i{display:block;height:100%;width:0;border-radius:5px;background:var(--teal);transition:width .12s linear,background .2s}
.thmeter u{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff8;left:0;transition:left .2s}
#thB{font-size:18px;color:var(--amber);transition:opacity .08s,transform .12s}#thFin{width:100%;margin-top:var(--g)}
